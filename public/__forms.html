<!doctype html>
<html>
  <head>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Netlify's form detection runs over the deployed static files at build
      time. It cannot see a form that React renders, and with the App Router
      almost nothing is a plain static page - so the real contact form is
      invisible to it no matter what attributes it carries.

      This file is the declaration. Nobody ever sees it: the browser posts to
      it, Netlify intercepts the request, stores the submission and sends the
      notification email. It renders nothing.

      Every `name` here must match the real form in
      src/components/sections/ContactForm.tsx exactly. A field that is missing
      here is silently dropped from the notification - it does not error, it
      just never arrives.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="company_website" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="company_website" />
      <input type="text" name="locale" />
    </form>
  </body>
</html>
