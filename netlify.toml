[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime — handles the App Router, the middleware and the
# image optimiser. Without it the middleware locale redirect does not run.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the immutable build output. Everything under /_next/static is
# content-hashed, so it can never go stale.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The 404 status, without giving up the localised 404 page.
#
# The middleware REWRITES an unknown path under a locale to that locale's 404
# page, which is what makes it a Hebrew page for a Hebrew visitor - lang, dir,
# navigation, footer, the accessibility menu. A rewrite answers 200, so Google
# reads these as soft 404s.
#
# The alternative was tested and rejected twice: calling `notFound()` from the
# catch-all DOES return a real 404, and serves Next's built-in error page with
# no lang, no dir and no chrome. That is a 3.1.1 Level A failure on a site that
# publishes an accessibility statement, in exchange for a status code.
#
# These rules are the third way: Netlify serves the target's CONTENT with the
# status given here. Non-forced, so they apply only when nothing else matched -
# a real route, a static file and the metadata routes all win first.
#
# UNVERIFIABLE LOCALLY. `next start` does not read netlify.toml. This must be
# checked on a deploy preview:
#     curl -I https://<preview>/he/nope-123   -> HTTP/2 404
#     curl -s  https://<preview>/he/nope-123  -> lang="he" dir="rtl", nav present
# If the Next runtime claims the path before these rules, delete this block
# rather than leaving a rule that does nothing.
[[redirects]]
  from = "/he/*"
  to = "/he/404"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en/404"
  status = 404

# Everything under public/ was served `max-age=0, must-revalidate` - Next's
# default - so every repeat visitor re-downloaded the paper texture and all
# five project captures. These are content, not build output, so they carry no
# hash: a year of caching would strand a replacement. A day is the compromise -
# it removes the cost for a session and for same-week return visits, and a
# changed image is live within 24h without anyone remembering to bust anything.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Content-Security-Policy, REPORT-ONLY on purpose.
#
# The site already sends HSTS, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy and Permissions-Policy; CSP was the only one missing. It is
# also the only one that can take the site down if it is wrong, and Next ships
# inline bootstrap scripts and inline styles that a naive policy blocks
# instantly.
#
# So it reports and does not enforce. Watch the browser console on a deploy
# preview, confirm nothing is blocked - especially /_next/image, the inline
# hydration script and the JSON-LD blocks - and only then rename the header to
# Content-Security-Policy. Do not skip that step to score a point.
#
# 'unsafe-inline' on script-src is required by Next's bootstrap; removing it
# needs a nonce threaded through the layout, which is a separate change.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Security headers live in next.config.ts, not here. Netlify's header rules do
# not reach HTML served by the Next.js runtime — only static files — so setting
# them at this layer silently covered assets and left every page uncovered.
