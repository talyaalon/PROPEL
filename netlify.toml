[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime — handles the App Router, the middleware and the
# image optimiser. Without it the middleware locale redirect does not run.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the immutable build output. Everything under /_next/static is
# content-hashed, so it can never go stale.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
