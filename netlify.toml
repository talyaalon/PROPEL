[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime - handles the App Router, the middleware and the
# image optimiser. Without it the middleware locale redirect does not run.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# ─────────────────────────────────────────────────────────────────────────────
# One canonical host
# ─────────────────────────────────────────────────────────────────────────────

# Measured on 2026-08-27: propel.co.il and propel-agency.netlify.app both
# served the complete site, each with a canonical pointing at ITSELF, each
# with its own robots.txt and its own 38-URL sitemap. Google was being handed
# two identical sites, so links, shares and anything the articles earn split
# between them - and the .co.il, the one that matters for Israeli search, got
# only part of it.
#
# `force = true` because the path IS served by the Next handler; without it a
# rule that merely matches an existing route does not win. A host-scoped
# `from` means this fires only for requests arriving on the netlify.app host,
# so it is inert on the deploy that serves the real domain.
#
# VERIFY AFTER DEPLOY: `curl -sI https://propel-agency.netlify.app/he` must
# answer 301 with `location: https://propel.co.il/he`. A previous redirect
# rule in this file never fired (see the 404 note at the bottom), so this one
# is not trusted until it is measured.
[[redirects]]
  from = "https://propel-agency.netlify.app/*"
  to = "https://propel.co.il/:splat"
  status = 301
  force = true

# ─────────────────────────────────────────────────────────────────────────────
# The one entry point that took two hops
# ─────────────────────────────────────────────────────────────────────────────
#
# Measured on 2026-10-08, every non-canonical variant, hop by hop:
#
#   http://propel.co.il/         301 -> https://propel.co.il/        1 hop
#   https://www.propel.co.il/    301 -> https://propel.co.il/        1 hop
#   http://www.propel.co.il/     301 -> https://www.propel.co.il/
#                                301 -> https://propel.co.il/        2 HOPS
#
# Three of the four were already single-hop. The fourth was not, because
# Netlify does the HTTPS upgrade and the apex consolidation as two separate
# edge steps and neither is configurable. This rule collapses them by matching
# the scheme and host together.
#
# `force = true` for the same reason as the rule above: the path IS served by
# the Next handler, and a rule that merely matches an existing route does not
# win without it.
#
# VERIFY AFTER DEPLOY. This cannot be tested from a local build - `next start`
# never sees the scheme or the host, so there is no way to know from here
# whether Netlify's redirect engine runs before its own forced-HTTPS step. The
# netlify.app rule above proves host-scoped matching works; it does not prove
# scheme-scoped matching does.
#
#   curl -sI http://www.propel.co.il/ | grep -iE '^HTTP|^location'
#
# Want exactly one 301 with `location: https://propel.co.il/`. If it still
# shows two hops, this rule did not fire and should be DELETED rather than
# left in place - see the 404 note at the bottom of this file for why a rule
# that looks like it works and does not is worse than no rule.
[[redirects]]
  from = "http://www.propel.co.il/*"
  to = "https://propel.co.il/:splat"
  status = 301
  force = true

# ─────────────────────────────────────────────────────────────────────────────
# Caching
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Why these blocks also carry X-Content-Type-Options
# ─────────────────────────────────────────────────────────────────────────────
#
# The five security headers live in `next.config.ts`, and the comment there
# records the measurement: pages and generated `opengraph-image` routes carry
# all five, and files served straight off the CDN carry none. Measured on
# production on 2026-10-08:
#
#   curl -sI https://propel.co.il/he          all five present
#   curl -sI https://propel.co.il/paper.webp  none of them
#
# A Next `headers()` rule is applied by the Next handler, and a file in
# `public/` never reaches it. So the one header that is worth having on a
# static asset is added here, in the blocks that already exist for caching.
#
# Only `nosniff`. The other four are meaningless on an image: there is no
# document to frame, no referrer policy to express, no CSP to enforce on a PNG,
# and HSTS is already added by Netlify on every response.
#
# The build output is content-hashed, so it can never go stale.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Everything under public/ was served `max-age=0, must-revalidate` - Next's
# default - so every repeat visitor re-downloaded the paper texture and all
# five project captures. These are content, not build output, so they carry no
# hash: a year of caching would strand a replacement that nobody thought to
# rename.
#
# A day, plus a week of stale-while-revalidate. The swr is the part that
# matters: inside that week the visitor gets the cached bytes immediately and
# the browser refreshes in the background, so a replaced image is live on the
# next navigation rather than after a 24h wait. Strictly better than the bare
# max-age on both axes - faster repeat visits AND a shorter staleness window.
#
# Lighthouse still flags this: its cache audit reads max-age alone and wants a
# year. It is measuring the wrong thing for un-hashed content, and the ~20KiB
# it offers is not worth serving a stale logo for twelve months. Hash the
# filenames and this becomes free; until then this is the honest setting.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    X-Content-Type-Options = "nosniff"

# ─────────────────────────────────────────────────────────────────────────────
# What is deliberately NOT here
# ─────────────────────────────────────────────────────────────────────────────

# Security headers, CSP included, live in next.config.ts. Netlify's header
# rules do not reach HTML served by the Next runtime - only static files - so
# setting them here silently covers assets and leaves every page uncovered.
# That was measured on production: the CSP was present on /paper.webp and
# absent on /he. Keeping a copy here as well would also risk two CSP headers on
# one response, which browsers intersect rather than merge.

# No 404 redirect rules, and that is a finding rather than an omission.
#
# A `[[redirects]]` block with `status = 404` is the standard Netlify way to
# serve a custom error page with a real status. It was tried, deployed and
# measured: /he/nope-123 still answered 200. The Next runtime claims the path
# through the middleware before Netlify's redirect table is consulted, so the
# rule never fired. A rule that looks like a safeguard and is not one is worse
# than no rule.
#
# The 404 is solved in `src/middleware.ts` instead. It fetches the prerendered
# localised 404 page and returns the HTML with a 404 status, so the response
# carries `lang`, `dir`, the stylesheet, the navigation and the footer AND the
# right status. `notFoundResponse` there records the five mechanisms that were
# built and measured before it, including the one that works under
# `next start` and is undone by this platform's cache. Verified on production:
#
#   curl -sI https://propel.co.il/he/zzz-test | grep -iE '^HTTP|propel-404'
#   HTTP/1.1 404 Not Found
#   X-Propel-404: page
#
# Do not add a redirect rule here to "fix" the 404. It cannot fire, and it
# would only hide which layer is answering.
